pointcloud_to_laserscan:
  ros__parameters:
    angle_increment: 0.005236
    angle_max: 3.141592653589793
    angle_min: -3.141592653589793
    inf_epsilon: 1.0
    max_height: 0.5
    min_height: 0.0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: best_effort
    queue_size: 12
    range_max: 100.0
    range_min: 0.0
    scan_time: 0.03333333333333333
    target_frame: 'base_link'
    transform_tolerance: 0.01
    use_inf: true
    use_sim_time: false

